services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: pool
      POSTGRES_DB: pool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in pool/.env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pool_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pool -d pool"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  pool_postgres:
